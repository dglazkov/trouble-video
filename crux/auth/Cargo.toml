[package]
name = "auth"
version = "0.1.0"
# Its own, not the workspace's: a product takes this directory as it is (crux.toml).
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Who may sign in to a product through Firebase: its ID token checked against Google's keys, and the session the server answers with."

[dependencies]
getrandom = "0.2"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
rsa = "0.9"
tokio = { version = "1", features = ["rt", "macros"] }
