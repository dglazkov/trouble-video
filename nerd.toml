# What nerd needs to know to deploy this project. `nerd guide` lists what else can go here.
name = "trouble-video"

[crux]
commit = "07c42393cd468edc72ea919ac3e297baf132c13b"
parts = ["server", "auth", "telemetry", "widget", "probe", "chrome", "load"]

[[test]]
name = "cargo"
run = "cargo test"
covers = ["**"]
tools = ["cargo --version"]
limit = "10m"

[[test]]
name = "page"
run = "sh crux/chrome/ready.sh && npx --yes tsx@4.20.6 tests/run.mjs page"
covers = ["**"]
tools = ["cargo --version", "node --version"]
limit = "10m"

[[intuition]]
name = "speed"
run = "npx --yes tsx@4.20.6 crux/probe/speed.ts --page home=/ --json"
when = ["deploy"]
baseline = "probe/speed.json"
