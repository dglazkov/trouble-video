# The product's server, and its workspace: the product's own crates, and crux's parts, as nerd crux copies them into
# crux/NAME. Written by nerd new from crux's scaffold (crux.toml's server); it is the product's now.
[package]
name = "app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
load = { workspace = true }
server = { workspace = true }
telemetry = { workspace = true }
widget = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[workspace]
members = [".", "crux/server", "crux/auth", "crux/telemetry", "crux/widget", "crux/load"]
resolver = "2"

# Where each of crux's parts is, for the product's crates and for a part that depends on another (crux/widget and
# crux/load on server, crux/load on telemetry for its tests).
[workspace.dependencies]
server = { path = "crux/server" }
auth = { path = "crux/auth" }
telemetry = { path = "crux/telemetry" }
widget = { path = "crux/widget" }
load = { path = "crux/load" }

# auth's tests make RSA keys to sign their ID tokens with, which unoptimized takes seconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
